<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Shadowcast. Summoner's Rift is a square split corner to corner, and what this
       engine computes is which half of the map each team can see, so the mark is that
       split: blue side, red side, divided along the diagonal. The division is a
       staircase rather than a straight line because the engine rasterises vision onto
       a 512x512 grid, and every boundary it produces looks exactly like this. -->
  <defs><clipPath id="c"><rect width="32" height="32" rx="7"/></clipPath></defs>
  <rect width="32" height="32" rx="7" fill="#0E0E12"/>
  <g clip-path="url(#c)">
    <polygon points="0,0 32,0 28,0 28,4 24,4 24,8 20,8 20,12 16,12 16,16 12,16 12,20 8,20 8,24 4,24 4,28 0,28 0,32 0,32" fill="#63A7E8"/>
    <polygon points="32,0 28,0 28,4 24,4 24,8 20,8 20,12 16,12 16,16 12,16 12,20 8,20 8,24 4,24 4,28 0,28 0,32 32,32" fill="#E86D50"/>
    <polyline points="32,0 28,0 28,4 24,4 24,8 20,8 20,12 16,12 16,16 12,16 12,20 8,20 8,24 4,24 4,28 0,28 0,32" fill="none" stroke="#0A0A0C" stroke-width="1.4"/>
  </g>
</svg>
