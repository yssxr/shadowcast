[project]
name = "shadowcast"
version = "0.1.0"
description = "Reconstructing what League of Legends teams could actually see, from packet-level decoded replays."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Yasser" }]

# Numba lags NumPy by a release or two and pins numpy<=X. Let the resolver take
# numba first and derive numpy from it; the explicit upper bound is a tripwire so
# a future `uv lock --upgrade` cannot silently pull a numpy numba refuses to load.
dependencies = [
    "numba>=0.61",
    "numpy>=1.26,<3",
    "typer>=0.12",
    "pillow>=10.2",
]

[project.optional-dependencies]
# L1 onwards: columnar store + query layer. Not needed to build terrain or FOV.
store = [
    "polars>=1.0",
    "pyarrow>=16.0",
    "duckdb>=1.0",
]
# L0: pulling shards from HuggingFace.
acquire = [
    "huggingface-hub>=0.24",
]

[project.scripts]
shadowcast = "shadowcast.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "ruff>=0.9",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadowcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Numba's first-call JIT makes a cold test run slow and noisy; -q keeps it readable.
addopts = "-q --strict-markers"
markers = [
    "slow: exhaustive oracles and precomputes; deselect with -m 'not slow'",
]

# ---------------------------------------------------------------------------
# Lint and format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear: likely bugs and design problems
    "C4",   # comprehension clarity
    "SIM",  # simplifiable constructs
    "RUF",  # ruff's own rules
    "NPY",  # numpy-specific correctness (legacy random, deprecated aliases)
    "PIE",  # misc lints
    "PT",   # pytest style
    "RET",  # return-path clarity
    "TID",  # tidy imports
]
ignore = [
    # The engine is full of short mathematical names, dx, dj, r2, si, wj. That read
    # better than any expansion would. Ambiguous single letters (l, I, O) stay banned
    # via E741, which is not ignored.
    "E731",  # lambda assignment; used deliberately in a couple of sort keys
    "B905",  # zip() strict=; noisy on numpy zips where lengths are structurally equal
    "RET504", # named return values often document what is being returned
    "SIM108", # ternary-instead-of-if; frequently less readable for numeric branches
    # Docstrings here are prose and deliberately use typographic characters, em
    # dashes, multiplication signs, >=. Flagging them as "ambiguous unicode" would
    # mean writing worse documentation to satisfy a lint for source identifiers.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately reach into internals and use magic numbers as fixtures.
"tests/*" = ["E501"]
# The constants module is a wall of documented literals; import order there is
# semantic (grouped by subsystem) rather than alphabetical.
"src/shadowcast/constants.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["shadowcast"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
# Editors and the pyright LSP need to be pointed at the uv-managed venv; without
# venvPath/venv every third-party import resolves to nothing and the real errors
# drown in forty-odd spurious "could not be resolved".
[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "data", "web"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
# numba ships no type information, so every @njit function is an untyped call and
# every numba import is unresolved-in-stubs. Reporting that is noise, not signal,
# the JIT layer is pinned by tests, not by the checker.
reportMissingTypeStubs = false
reportUntypedFunctionDecorator = false
